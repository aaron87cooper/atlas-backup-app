<h1>Atlas backup</h1>
<p>Atlas backup is a private, personal tool. It copies encrypted backups of one person's own computers into that person's own Google Drive, using the open-source tools restic and rclone.</p>
<p>It is not offered to anyone else, has no other users, and cannot be signed up for.</p>
